<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Baseball — Full Game</title>
    <style>
      /* Same split as the roguelike screen: canvas for the pitch, DOM for
         everything that is text. Text in a canvas is a thing you regret. */
      :root {
        --ink: #e8e8d8;
        --dim: #7a8a6a;
        --line: #2f3a2a;
        --bg: #0d1210;
        --panel: #141b16;
        --hot: #d8b44a;
        --good: #6fbf62;
        --bad: #c4574a;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px;
        min-height: 100vh;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      .wrap { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
      }

      /* ---- scoreboard */
      table.line { width: 100%; border-collapse: collapse; font-size: 12px; }
      table.line th, table.line td {
        padding: 2px 6px; text-align: center; border-bottom: 1px solid var(--line);
      }
      table.line th { color: var(--dim); font-weight: 400; }
      table.line td.team { text-align: left; white-space: nowrap; }
      table.line td.tot { color: var(--hot); font-weight: 700; }
      tr.batting td.team::before { content: "\25B8 "; color: var(--hot); }

      /* ---- the strip under the scoreboard */
      .strip { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
      .strip b { color: var(--hot); }
      .dim { color: var(--dim); }

      /* ---- field + side column */
      .stage { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
      canvas {
        image-rendering: pixelated;
        border: 1px solid var(--line);
        background: #0a0f0c;
        flex: 1 1 420px;
        max-width: 100%;
        height: auto;
        cursor: pointer;
      }
      .side { flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; min-width: 220px; }

      /* ---- controls */
      .keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
      /* The spot picker is the strike zone, so it is always three by three —
         never auto-fit, or the grid reflows and stops matching the zone. */
      .zone { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

      /* ---- the bullpen, set apart from the pitch call on purpose. It is the
         one control on this screen that cannot be taken back, so it does not
         sit in the row your hand is already in — see penArmed in main.ts. */
      .pen { margin-top: 14px; border-top: 1px solid #253026; padding-top: 10px; }
      .penhead { font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }
      .penrow {
        display: grid; grid-template-columns: 84px 1fr auto auto;
        gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0;
      }
      .penrow > span:first-child { color: var(--dim); font-size: 10px; letter-spacing: 1px; }
      .penrow b { font-weight: 400; }
      .pengo {
        margin-top: 8px; width: auto; padding: 6px 14px; font-size: 11px;
        letter-spacing: 1px; color: var(--dim);
      }
      .pengo.on { color: var(--bad); border-color: var(--bad); }
      /* ---- the pitch chart, under the throw button. The same widget as the
         pen — a list of rows with a label, a name and two readings — so the
         only rule it needs is a first column narrow enough for a pitch number
         instead of a word. */
      .chart .penrow { grid-template-columns: 12px 1fr auto auto; font-size: 10px; gap: 6px; }
      /* ---- the selected arm, in the pen panel and in the rotation picker.
         One rule for both: they are the same widget asking the same question
         about two different lists. */
      .penrow.picked { background: #1b241d; }
      .penrow.picked b { color: var(--hot); }
      /* ---- the bench, in the side column while you are hitting. Stacked
         rather than columned: it carries a hand and three ratings, which is one
         more than the pen's grid can fit in 240px without wrapping every name
         onto three lines. Same picked highlight, so it reads as the same widget. */
      .benchrow { font-size: 11px; padding: 4px 0; line-height: 1.5; }
      .benchrow b { font-weight: 400; }
      .benchrow.picked { background: #1b241d; }
      .benchrow.picked b { color: var(--hot); }
      .benchname { display: flex; justify-content: space-between; gap: 8px; }
      #pre .rotation .penrow { grid-template-columns: 80px 1fr auto auto; padding: 5px 0; }
      /* The batting order is the same widget again — a list of your own men
         with one of them picked up. Wider first column than the rotation's
         because it holds a slot number and the word "moving". */
      #pre .lineup .penrow { grid-template-columns: 72px 1fr auto auto; padding: 5px 0; }
      button {
        font: inherit;
        color: var(--ink);
        background: #1b241d;
        border: 1px solid var(--line);
        padding: 7px 6px;
        cursor: pointer;
        text-align: left;
      }
      button:hover:not(:disabled) { border-color: var(--hot); }
      button:disabled { opacity: 0.35; cursor: default; }
      button.on { border-color: var(--hot); color: var(--hot); }
      button kbd { color: var(--dim); font-size: 11px; }

      /* ---- log */
      #log { height: 150px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 2px; }
      #log div { border-bottom: 1px solid #1a221c; padding: 2px 0; }
      #log .big { color: var(--hot); }
      #log .out { color: var(--dim); }
      #log .half { color: var(--good); margin-top: 4px; }

      #banner { font-size: 15px; min-height: 24px; color: var(--hot); }
      h1 { font-size: 13px; letter-spacing: 2px; color: var(--dim); font-weight: 400; }
      .book { font-size: 11px; color: var(--dim); line-height: 1.7; }
      .book b { color: var(--ink); font-weight: 400; }

      /* ---- the two full-screen overlays: pick a mode, then look at the card.
         One rule for both — they are the same object at different moments, and
         a second copy of this block is how they drift apart. BOTH scroll: #pre
         carries a standings table, and #start carries thirty clubs, which is
         six rows of buttons on a laptop and more than that on a phone.
         `safe center` is the centring that gives up rather than clipping the
         top of a list too tall for the screen — plain `center` would put the
         first row of clubs above the scroll and out of reach. */
      #start, #pre {
        position: fixed; inset: 0; z-index: 5; background: var(--bg);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 20px;
      }
      #start, #pre { overflow-y: auto; }
      #start { justify-content: safe center; }
      #pre { justify-content: flex-start; gap: 10px; }
      #pre .wrap { max-width: 720px; gap: 10px; }
      #pre h2 { font-size: 13px; letter-spacing: 2px; color: var(--hot); font-weight: 400; }
      #pre .vs { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
      #pre .vs .panel { flex: 1 1 260px; }
      #pre .club { font-size: 15px; color: var(--hot); letter-spacing: 1px; }
      #pre table.line td.team { text-align: left; }
      #pre tr.you td { color: var(--hot); }
      #pre .wire div { padding: 2px 0; border-bottom: 1px solid #1a221c; }
      #pre .wire .roster { color: var(--good); }
      #pre .go { width: 100%; text-align: center; padding: 12px; font-size: 14px; }
      /* ---- the calendar. Every day of the year as one wrapping grid of equal
         cells, because at 162 games a table with a row per day is a scroll
         nobody reads and at 14 it is four lines of nothing. auto-fill rather
         than auto-fit so the cells stay the same size on a short season as on
         a long one — a fourteen-game year should not draw five cells stretched
         across the whole screen. */
      #pre .calgrid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 5px;
      }
      #pre .cal {
        display: flex; flex-direction: column; gap: 1px;
        background: var(--panel); border: 1px solid var(--line);
        padding: 6px 7px; font-size: 11px; line-height: 1.4; text-align: left;
      }
      /* The day number, small and out of the way — it is how you find a cell,
         not what the cell says. */
      #pre .cal .calday { color: var(--dim); font-size: 10px; letter-spacing: 1px; }
      /* Played: text, not a door. See showCalendar — there is no rewinding. */
      #pre .cal.done, #pre .cal.off { opacity: 0.55; }
      #pre .cal .w { color: var(--good); }
      #pre .cal .l { color: var(--bad); }
      /* Today, and the only cell that plays rather than skips. */
      #pre button.cal.now { border-color: var(--hot); }
      #pre button.cal.now .calday { color: var(--hot); }

      /* ---- a franchise moment. Same overlay, so the only new rule is that the
         choices stack full-width and read as paragraphs rather than as the
         grid of club buttons on the start screen. */
      #pre .choices { display: flex; flex-direction: column; gap: 8px; }
      #pre .choice { padding: 12px; line-height: 1.6; }
      #pre .choice b { color: var(--hot); font-weight: 400; letter-spacing: 1px; }
      /* ---- the league screen's box. It is TRANSPORT for a quarter-megabyte
         document — fill it, copy it out, edit it somewhere with a search
         function, paste it back — so it wants to be tall, monospaced and
         selectable. The body sets user-select:none for the game; a textarea
         nobody can select from would make the copy step impossible. */
      #start textarea {
        width: 100%; min-height: 210px; padding: 8px; resize: vertical;
        background: #0a0f0c; color: var(--ink); border: 1px solid var(--line);
        font: 11px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        -webkit-user-select: text; user-select: text;
      }
      #start textarea:focus { outline: none; border-color: var(--hot); }
      /* What the validator had to say. One line per complaint, and it has to
         stay readable at twenty-five of them. */
      #start .says {
        border: 1px solid var(--bad); border-left-width: 3px; padding: 8px 10px;
        font-size: 11px; line-height: 1.6; color: var(--ink);
        max-height: 190px; overflow-y: auto;
      }
      #start .keys { width: 100%; max-width: 820px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      #start button { text-align: center; padding: 12px 8px; }
      #start button b { color: var(--hot); font-weight: 400; letter-spacing: 1px; }

      /* ================================================================
         THE MENU, DRESSED AS A CARTRIDGE.

         ⚠️ STILL NOT ONE IMAGE, AND STILL NO FONT TO FETCH. Every mark below
         is type, a border or a hard-stop fill, for the same reason the
         ballpark version was: `npm run export` folds this screen into ONE
         offline html file, and an asset that has to be fetched is an asset
         that is not there when somebody opens it off a USB stick. A webfont is
         the obvious way to get 8-bit type and it is precisely the thing this
         screen cannot have.

         WHICH IS FINE, BECAUSE THE FONT IS NOT WHAT MAKES A CONSOLE MENU LOOK
         LIKE ONE. In the order it actually matters: a black outline round the
         title with one hard coloured shadow under it; a double-ruled window
         round the prompt; a BLINKING cursor beside whatever is selected; flat
         fills and square corners with no blur anywhere; and scanlines over the
         lot. Not one of those is a typeface.

         The furniture stays the ballpark's — the seam, the cap patch, home
         plate. Old console, new game.
         ================================================================ */

      /* The field, the lights, and the glass in front of them. */
      #start {
        background:
          repeating-linear-gradient(
            100deg, transparent 0 46px, rgba(190, 255, 170, 0.016) 46px 92px
          ),
          radial-gradient(125% 85% at 50% -15%, #17271b 0%, var(--bg) 60%);
      }
      /* SCANLINES, on the glass rather than on the page — fixed, so they do
         not scroll away under thirty club cards. pointer-events:none, or a
         layer drawn over the whole screen eats every click on it. */
      #start::after {
        content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background: repeating-linear-gradient(
          to bottom, rgba(0, 0, 0, 0.24) 0 1px, transparent 1px 3px
        );
      }

      /* ---- the marquee. Outlined on all eight sides in black so it holds its
         shape at any size, and dropped once into the seam red. No blur: a soft
         glow is the one thing that would give the whole trick away. */
      #start h1 {
        font-size: 32px; letter-spacing: 9px; color: var(--ink);
        font-weight: 700; text-align: center; line-height: 1.15;
        margin-bottom: 2px;
        text-shadow:
          2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000,
          2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000,
          5px 5px 0 var(--bad);
      }
      /* The stitching: two dashed rules in the seam red, the way a ball is
         seamed. Purely a rule under the title — it is the cheapest mark on this
         screen and it does more for the theme than anything else here. */
      #start .seam {
        width: 100%; max-width: 300px; height: 18px;
        position: relative; opacity: 0.8; margin: 8px 0 2px;
      }
      /* Two parallel arcs, both bowing the same way — which is how the seam
         actually runs across a ball, and what tells the eye 'baseball' rather
         than 'dashed rule'. An elliptical border-radius bends a dashed border
         into a curve; that is the whole trick, and it costs two empty spans. */
      #start .seam i {
        position: absolute; left: 0; right: 0; height: 14px;
        border-bottom: 2px dashed var(--bad);
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
      }
      #start .seam i:first-child { top: 0; }
      #start .seam i:last-child { top: 6px; }

      /* ---- the prompt, in the double-ruled window every console menu draws
         its text in: a line, a gap of background, and a second line. One
         border and one box-shadow, no image. */
      #start h2 {
        font-size: 12px; letter-spacing: 4px; color: var(--hot); font-weight: 400;
        background: #000; border: 2px solid var(--ink);
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink);
        padding: 8px 22px; text-align: center; margin: 6px 0 8px;
      }

      /* ---- EVERY CARD ON THIS SCREEN IS A SPRITE: a two-pixel edge, a flat
         fill, and one hard shadow down and to the right. No radius, no
         gradient, no blur, and nothing that moves when you point at it — the
         selection is a cursor, not an animation. */
      #start button {
        text-align: center; padding: 12px 8px;
        border: 2px solid var(--line); background: #16201a;
        box-shadow: 3px 3px 0 #000;
        position: relative;
      }
      #start button b { color: var(--hot); font-weight: 700; letter-spacing: 1px; }
      #start button:hover:not(:disabled),
      #start button:focus { border-color: var(--hot); outline: none; }

      /* THE CURSOR, AND IT BLINKS — which is the whole difference between a
         highlighted row and a console menu. steps(1) so it is on or it is off
         and never anything in between.

         ⚠️ :focus, NOT :focus-visible. draw() puts the cursor on the first
         button of every screen it draws, and a browser is entitled to decide a
         programmatic focus does not deserve a focus RING — which would leave
         ENTER pressing something the player cannot see. This screen's cursor is
         not a ring, it is the selection, so it is always drawn.

         ⚠️ DIRECT CHILDREN OF THE GRID ONLY. A dial's two arrows are buttons
         too, and a cursor inside the control it is pointing at reads as a
         glyph somebody left behind. */
      #start .keys > button:hover:not(:disabled)::before,
      #start .keys > button:focus::before {
        content: "\25B6"; position: absolute; left: 5px; top: 50%;
        margin-top: -0.6em; color: var(--hot); font-size: 12px;
        animation: cursorblink 0.7s steps(1, end) infinite;
      }
      @keyframes cursorblink { 50% { opacity: 0; } }

      /* ---- THE DIAL. One setting, its current value, and the two arrows that
         change it. Full width of the grid: a setting is a question, and a
         question that shares a row with another question reads as neither.
         The thick left edge is the console list marker — it lights when the
         cursor is anywhere in the row, which on this screen means either arrow
         has the focus. */
      #start .dial {
        grid-column: 1 / -1; background: var(--panel);
        border: 2px solid var(--line); border-left: 6px solid #2f3a2a;
        box-shadow: 3px 3px 0 #000;
      }
      #start .dial:hover, #start .dial:focus-within { border-left-color: var(--hot); }
      #start .dialhead {
        font-size: 10px; letter-spacing: 2px; color: var(--dim);
        padding: 8px 12px 0; text-align: left;
      }
      #start .dialbody { display: grid; grid-template-columns: 52px 1fr 52px; }
      /* The arrows are the control. Big hit area, no border and no shadow of
         their own — the dial is the sprite, these are its two ends. */
      #start .arrow {
        background: transparent; border: 0; box-shadow: none; color: var(--dim);
        font-size: 19px; padding: 0; line-height: 1; cursor: pointer;
      }
      #start .arrow:hover:not(:disabled),
      #start .arrow:focus { color: var(--hot); background: #1b241d; outline: none; }
      #start .arrow:disabled { opacity: 0.2; cursor: default; }
      #start .dialval { text-align: center; padding: 4px 6px 9px; }
      #start .dialval b {
        display: block; font-size: 17px; letter-spacing: 3px;
        color: var(--hot); font-weight: 700;
        text-shadow: 2px 2px 0 #000;
      }
      #start .dialval span { font-size: 11px; color: var(--dim); line-height: 1.5; }
      /* Where you are in the list, as square lamps rather than bars. Four
         settings deep is not obvious from one value on its own. */
      #start .pips { display: flex; gap: 5px; justify-content: center; padding-bottom: 9px; }
      #start .pips i { width: 7px; height: 7px; background: #2f3a2a; }
      #start .pips i.on { background: var(--hot); }

      /* ---- THE CLUB CARDS. A cap patch, the name, and what the club IS —
         which the old grid of thirty identical tiles never said, so picking one
         was picking a three-letter code out of a hat. */
      #start .clubcard {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        padding: 12px 8px 11px;
      }
      #start .patch {
        width: 48px; height: 48px; display: grid;
        place-items: center; font-size: 13px; letter-spacing: 1px;
        color: #0d1210; font-weight: 700;
        /* A CIRCLE THE WAY A SPRITE DRAWS ONE — corners cut off, not rounded
           off. A 48px anti-aliased circle is the one shape on this screen that
           would read as CSS rather than as a cap, and an octagon costs the same
           one line border-radius did. The hard band along the bottom is the
           shading a two-colour sprite gets. */
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        box-shadow: inset 0 -7px 0 rgba(0, 0, 0, 0.3);
      }
      /* A fixed two-line well for the name, so a club called Los Angeles
         Aqueducts does not stand a row taller than one called Chicago Ivy. */
      #start .clubcard .nm {
        color: var(--ink); line-height: 1.35; min-height: 2.7em;
        display: flex; align-items: center; justify-content: center;
      }
      #start .clubcard .who { font-size: 10px; letter-spacing: 1px; color: var(--dim); }
      #start .clubcard .who b { font-weight: 700; letter-spacing: 1px; }

      /* ---- HOME PLATE. The one button on any screen that starts baseball.
         drop-shadow rather than box-shadow because the shadow has to follow the
         clip-path — a box shadow would draw the rectangle the plate was cut out
         of and give the shape away. */
      #start .plate {
        grid-column: 1 / -1; width: 100%; max-width: 340px; margin: 10px auto 0;
        clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%);
        padding: 16px 12px 42px; background: #1e2a1c;
        border: 0; box-shadow: none; color: var(--ink);
        font-size: 15px; letter-spacing: 3px;
        filter: drop-shadow(4px 4px 0 #000);
      }
      #start .plate:hover, #start .plate:focus { background: #27351f; }
      #start .plate b { color: var(--hot); }
      #start .plate .sub {
        display: block; font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-top: 3px;
      }

      /* ---- a heading between groups of cards, chalked on. */
      #start .chalk {
        grid-column: 1 / -1; font-size: 10px; letter-spacing: 3px; color: var(--dim);
        text-align: left; padding: 4px 0 0; border-bottom: 1px solid #202a1e;
        margin-bottom: 2px;
      }

      /* ---- the line along the bottom of every cartridge's title screen. It
         earns its place twice over: the controls are the half nobody would
         guess (this screen has a d-pad now — see the handler in main.ts), and a
         menu with nothing under it looks unfinished on a tall monitor. */
      #start .copy {
        display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
        font-size: 10px; letter-spacing: 3px; color: var(--dim);
        padding-top: 6px;
      }

      /* ================================================================
         THE FACE. Press Start 2P — CodeMan38, SIL Open Font License 1.1
         (https://openfontlicense.org). Latin only: 12 kB, which is the block
         the menu needs rather than the sixty of every alphabet.

         ⚠️ EMBEDDED, NOT FETCHED, AND THAT IS THE WHOLE REASON IT IS ALLOWED
         HERE. The rule the rest of this stylesheet keeps is that nothing on
         this screen may need the network, because `npm run export` folds the
         game into ONE html file that gets opened off a USB stick. A <link> to
         a font service breaks that; sixteen kilobytes of base64 sitting in the
         file does not. It costs about 6% of the export and it is the one thing
         CSS genuinely could not fake — every other 8-bit mark on this screen
         is a border or a shadow, but type is type.

         ⚠️ ONE LONG LINE, ON PURPOSE. A data: URL is a single CSS token and
         cannot be wrapped. Scroll past it; there is nothing to read.
         ================================================================ */
      @font-face {
        font-family: "Press Start 2P";
        font-style: normal;

         FURNITURE: the marquee, the prompt, the answer on a dial, the letters
         on a cap, and the line along the bottom. Everything somebody actually
         reads stays in the mono stack the rest of the game is set in.

         Every size below is smaller than the rule it overrides, because this
         face draws about a third bigger than a monospace at the same px. */
      /* > b, not b: the club rank ("STACKED · BIG INNING") lives in a span
         inside the card, and setting THAT in an 8x8 face wrapped every third
         card onto an extra line and left the grid ragged. A title that is a
         direct child of a button is furniture; anything deeper is prose. */
      #start h1, #start h2, #start .dialval b, #start button > b,
      #start .patch, #start .copy {
        font-family: "Press Start 2P", ui-monospace, monospace;
      }
      /* clamp, because 17 characters of an 8x8 face is a wide marquee and a
         phone is not. */
      #start h1 { font-size: clamp(13px, 3.4vw, 25px); letter-spacing: 3px; line-height: 1.4; }
      #start h2 { font-size: 10px; letter-spacing: 2px; padding: 10px 20px; }
      #start button > b { font-size: 9px; letter-spacing: 0; line-height: 1.8; }
      #start .dialval b { font-size: 13px; letter-spacing: 1px; line-height: 1.5; }
      #start .patch { font-size: 10px; letter-spacing: 0; }
      #start .copy { font-size: 8px; letter-spacing: 1px; }

      /* ---- AND THE SEAM INTO THE REST OF THE GAME. The card, the calendar
         and the box score are not the title screen and must not become it —
         they are tables, and a table set in an 8x8 face is unreadable. What
         they take is the two marks that say "same game": the prompt in its
         double-ruled window, and the one button on the screen that starts
         baseball. Everything else there stays exactly as it was. */
      #pre h2 {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 10px; letter-spacing: 2px; line-height: 1.6;
        background: #000; border: 2px solid var(--ink);
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink);
        padding: 9px 18px; align-self: center; text-align: center;
      }
      #pre .go {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 11px; letter-spacing: 1px; line-height: 1.6;
        border: 2px solid var(--line); box-shadow: 3px 3px 0 #000;
      }
      #pre .go kbd { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>ALL-STAR BASEBALL — EXHIBITION</h1>

      <div class="panel" id="scoreboard"></div>

      <div class="panel strip" id="situation"></div>

      <div class="panel strip" id="meta"></div>

      <div id="banner"></div>

      <div class="stage">
        <canvas id="field" width="420" height="340"></canvas>
        <div class="side">
          <div class="panel" id="controls"></div>
          <div class="panel" id="log"></div>
          <div class="panel book" id="book"></div>
        </div>
      </div>
    </div>
    <div id="start">
      <h1>ALL-STAR BASEBALL</h1>
      <!-- The ball's stitching, as two dashed rules. See #start .seam. -->
      <div class="seam"><i></i><i></i></div>
      <h2></h2>
      <div class="keys"></div>
      <!-- How hard the swing is. Drawn on the mode screen only, and answerable
           again all game from the strip under the scoreboard. -->
      <div class="keys levels"></div>
      <!-- The cartridge line. The controls half is the only place the d-pad is
           advertised; see the keydown handler in pregame(). -->
      <div class="copy"><span>ARROWS MOVE &middot; ENTER SELECTS</span><span>&copy; 2026 ZAI STUDIOS</span></div>
    </div>
    <!-- Filled and shown by showPregame() before every franchise game. Empty
         and hidden in an exhibition, which has no standings to stand on. -->
    <div id="pre" style="display:none"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
